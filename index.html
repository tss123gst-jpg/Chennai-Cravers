<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBites | Order Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cart-bounce { animation: bounce 0.3s ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 underline decoration-2">FreshBites</h1>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <header class="bg-orange-100 py-12 px-4 text-center">
        <h2 class="text-4xl font-extrabold text-gray-800 mb-2">Craving something delicious?</h2>
        <p class="text-gray-600">Fresh ingredients, delivered fast to your door.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="menu-container">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-[60] p-6">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold">Your Order</h3>
            <button onclick="toggleCart()" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="space-y-4 mb-6 overflow-y-auto max-h-[60vh]"></div>
        <div class="border-t pt-4">
            <div class="flex justify-between font-bold text-lg mb-4">
                <span>Total:</span>
                <span id="total-price">$0.00</span>
            </div>
            <button onclick="checkoutViaWhatsApp()" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 transition shadow-lg">
                Order via WhatsApp
            </button>
        </div>
    </div>

    <script>
        const menu = [
            { id: 1, name: "Classic Cheeseburger", price: 12.99, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 2, name: "Margherita Pizza", price: 14.50, img: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=400" },
            { id: 3, name: "Crunchy Taco Trio", price: 9.99, img: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=400" },
            { id: 4, name: "Garden Fresh Salad", price: 11.00, img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400" },
            { id: 5, name: "Spicy Ramen Bowl", price: 13.75, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" },
            { id: 6, name: "Avocado Toast", price: 8.50, img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400" }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menu.map(item => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition border border-gray-100">
                    <img src="${item.img}" class="w-full h-48 object-cover" alt="${item.name}">
                    <div class="p-4">
                        <h3 class="font-bold text-lg">${item.name}</h3>
                        <p class="text-orange-600 font-bold mt-1">$${item.price.toFixed(2)}</p>
                        <button onclick="addToCart(${item.id})" class="mt-4 w-full border-2 border-orange-500 text-orange-500 py-2 rounded-lg font-semibold hover:bg-orange-500 hover:text-white transition">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = menu.find(i => i.id === id);
            cart.push(item);
            updateCart();
            const count = document.getElementById('cart-count');
            count.classList.add('cart-bounce');
            setTimeout(() => count.classList.remove('cart-bounce'), 300);
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-sm font-medium">${item.name}</span>
                    <span class="text-sm text-gray-500">$${item.price.toFixed(2)}</span>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function checkoutViaWhatsApp() {
            if (cart.length === 0) {
                alert("Your cart is empty! Add some food first.");
                return;
            }

            // SET YOUR PHONE NUMBER HERE (International format, no + or 00)
            const phoneNumber = "918610444201"; 

            let message = "🍱 *New Food Order!* \n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} ($${item.price.toFixed(2)})\n`;
            });
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\n*Grand Total: $${total.toFixed(2)}*`;
            message += `\n\n_Please confirm if you received this order!_`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
